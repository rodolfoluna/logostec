<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogosTec · Generador de logos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231b396a'/%3E%3Ccircle cx='13' cy='16' r='7' fill='%234e8ad8' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1b396a"/><circle cx="13" cy="16" r="7" fill="#4e8ad8" stroke="#fff" stroke-width="2"/></svg>
      <div>
        <strong>LogosTec</strong>
        <span id="docName" class="muted"></span>
      </div>
    </div>
    <div class="actions">
      <button id="btnUndo" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
      <button id="btnRedo" title="Rehacer (Ctrl+Y)">↷ Rehacer</button>
      <span class="sep"></span>
      <button id="btnOpen" title="Abrir un diseño guardado (.json)">Abrir</button>
      <button id="btnSave" title="Guardar el diseño como .json para seguir editándolo">Guardar</button>
      <span class="sep"></span>
      <button id="btnSvg" class="primary" title="Descargar como SVG vectorial">SVG</button>
      <button id="btnPng" class="primary" title="Descargar como PNG">PNG</button>
      <select id="pngSize" title="Tamaño del PNG">
        <option value="512">512 px</option>
        <option value="1024">1024 px</option>
        <option value="2048" selected>2048 px</option>
        <option value="4096">4096 px</option>
      </select>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </div>
  </header>

  <main class="layout">
    <aside class="panel left">
      <section>
        <h2>Plantillas</h2>
        <div id="presets" class="thumbs"></div>
      </section>
      <section class="grow">
        <h2>Capas</h2>
        <div id="layers" class="layers" role="tree"></div>
        <div class="add">
          <select id="addElement"><option value="">+ Agregar elemento…</option></select>
          <select id="addLogo"><option value="">+ Insertar logo completo…</option></select>
          <button id="btnGroup" title="Crea un grupo vacío">+ Grupo</button>
        </div>
      </section>
    </aside>

    <section class="stage">
      <div class="stagebar">
        <div class="seg">
          <button id="zoomOut" title="Alejar">−</button>
          <button id="zoomFit" title="Ajustar a la ventana">Ajustar</button>
          <button id="zoomIn" title="Acercar">+</button>
        </div>
        <label>Fondo
          <select id="previewBg">
            <option value="cuadros">Cuadros</option>
            <option value="blanco">Blanco</option>
            <option value="gris">Gris</option>
            <option value="oscuro">Oscuro</option>
          </select>
        </label>
        <label class="chk"><input type="checkbox" id="showGuides"> Guías</label>
        <label class="chk" id="refWrap"><input type="checkbox" id="showRef"> Referencia
          <input type="range" id="refOpacity" min="0" max="1" step="0.05" value="0.5" title="Opacidad de la imagen de referencia">
        </label>
      </div>
      <div id="viewport" class="viewport bg-cuadros">
        <div id="canvas" class="canvas"></div>
      </div>
      <p class="hint">Haz clic en una pieza para seleccionarla y arrástrala para moverla. Flechas: mover · Supr: borrar · Ctrl+D: duplicar.</p>
    </section>

    <aside class="panel right">
      <section>
        <h2>Paleta de colores</h2>
        <div id="palette" class="palette"></div>
        <div class="row">
          <button id="btnAddColor">+ Color</button>
        </div>
        <details id="quickAdjust">
          <summary>Ajuste rápido de toda la paleta</summary>
          <label>Tono <input type="range" id="adjHue" min="-180" max="180" step="1" value="0"></label>
          <label>Saturación <input type="range" id="adjSat" min="-100" max="100" step="1" value="0"></label>
          <label>Luz <input type="range" id="adjLight" min="-50" max="50" step="1" value="0"></label>
          <button id="adjReset">Restablecer</button>
        </details>
      </section>
      <section>
        <h2>Variantes de color</h2>
        <div id="variants" class="thumbs small"></div>
        <div class="row">
          <button id="btnSaveVariant" title="Guarda los colores actuales como una variante">Guardar paleta actual</button>
          <button id="btnSuggest" title="Genera variantes a partir de la paleta actual">Sugerir variantes</button>
        </div>
        <div id="suggestions" class="thumbs small"></div>
      </section>
      <section>
        <h2 id="inspTitle">Capa</h2>
        <div id="inspector" class="inspector"></div>
      </section>
      <section>
        <h2>Lienzo</h2>
        <div id="canvasProps" class="inspector"></div>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/data/traced.js"></script>
  <script src="js/data/fonts.js"></script>
  <script src="js/text.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/render.js"></script>
  <script src="js/elements/formas.js"></script>
  <script src="js/elements/sistemas.js"></script>
  <script src="js/elements/itstr.js"></script>
  <script src="js/elements/tecnm.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
